<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Álbum en Vivo - Ericka & Omar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* Fondo principal y diseño expansivo (Responsive) */
    body {
      background-color: #1f1d1d;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
    }

    .phone-stage {
      /* Cambio clave: Se elimina el límite de ancho para llenar monitores/proyectores */
      width: 100%;
      max-width: 100%; 
      min-height: 100vh;
      
      /* FOTO DE FONDO de Ericka y Omar */
      background-image: url('IMG_7667-Mejorado-NR.jpg'); 
      background-size: cover;
      background-position: center center;
      background-attachment: fixed; /* Evita que la foto se deslice con el scroll */
      position: relative;
      overflow-x: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    /* Cristal esmerilado para la pantalla principal (Glassmorphism) */
    .glass-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 248, 244, 0.85); /* Blanco cálido semitransparente */
      backdrop-filter: blur(12px); /* Desenfoca la foto debajo */
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      z-index: 10;
      overflow-y: auto;
    }

    /* Colores base para la temática de la boda (Tonos tierra y olivo) */
    .bg-boda-primary { background-color: #c5a059; }
    .bg-boda-primary-hover:hover { background-color: #b59049; }
    .text-boda-primary { color: #c5a059; }
    
    .bg-boda-secondary { background-color: #596b52; }
    .text-boda-secondary { color: #596b52; }
    
    .bg-boda-tertiary { background-color: rgba(197, 160, 89, 0.15); }
    .border-boda { border-color: rgba(197, 160, 89, 0.3); }

    /* Tarjetas de cristal sobre el fondo */
    .glass-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    /* Elementos decorativos SVG en las esquinas */
    .decor-corner-top-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 150px;
      height: 150px;
      pointer-events: none;
      z-index: 5;
      opacity: 0.7;
    }
    
    .decor-corner-bottom-left {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 120px;
      height: 120px;
      pointer-events: none;
      z-index: 5;
      opacity: 0.6;
    }

    .scroll-content {
      position: relative;
      z-index: 20;
      padding-bottom: 80px; 
    }
  </style>
</head>
<body>

  <div class="phone-stage">
    
    <!-- Capa de cristal sobre la foto de fondo -->
    <div class="glass-overlay">

      <!-- ====================================================
           CAPA ARTÍSTICA: FOLLAJE BOTÁNICO EN CSS/SVG
           ==================================================== -->
      <!-- Esquina superior derecha -->
      <svg class="decor-corner-top-right" viewBox="0 0 250 250" fill="none">
        <path d="M250 30 Q190 50, 150 110 Q130 140, 125 170" stroke="#596b52" stroke-width="2" stroke-linecap="round"/>
        <path d="M185 55 C170 45, 175 32, 190 40 C200 48, 195 60, 185 55 Z" fill="#596b52"/>
        <path d="M175 68 C158 65, 155 50, 170 54 C182 58, 185 70, 175 68 Z" fill="#71866b"/>
        <path d="M155 85 C138 78, 142 62, 156 70 C168 76, 165 90, 155 85 Z" fill="#4a5a44"/>
        <path d="M140 115 C122 110, 126 95, 140 102 C152 108, 150 120, 140 115 Z" fill="#596b52"/>
        <path d="M125 168 C115 155, 128 145, 135 155 C140 162, 132 172, 125 168 Z" fill="#71866b"/>
        <line x1="80" y1="0" x2="250" y2="75" stroke="#c5a059" stroke-width="1.5" stroke-opacity="0.8"/>
        <line x1="130" y1="0" x2="250" y2="125" stroke="#c5a059" stroke-width="1.5" stroke-opacity="0.9"/>
      </svg>

      <!-- Esquina inferior izquierda -->
      <svg class="decor-corner-bottom-left" viewBox="0 0 230 260" fill="none">
        <path d="M10 250 Q40 190, 65 140 Q80 110, 95 80" stroke="#596b52" stroke-width="2" stroke-linecap="round"/>
        <path d="M30 215 C15 210, 20 195, 35 200 C48 205, 45 220, 30 215 Z" fill="#4a5a44"/>
        <path d="M48 185 C62 178, 65 192, 52 198 C40 202, 38 188, 48 185 Z" fill="#71866b"/>
        <path d="M55 155 C38 150, 42 135, 58 142 C70 148, 68 160, 55 155 Z" fill="#596b52"/>
        <line x1="0" y1="110" x2="160" y2="240" stroke="#c5a059" stroke-width="1.5" stroke-opacity="0.8"/>
        <line x1="0" y1="180" x2="200" y2="255" stroke="#c5a059" stroke-width="1.5" stroke-opacity="0.85"/>
      </svg>

      <!-- Encabezado fijo transparente -->
      <header class="sticky top-0 z-30 bg-white/40 backdrop-blur-md border-b border-white/50 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-2xl">💍</span>
          <h1 class="text-lg font-bold text-slate-800 tracking-tight" style="font-family: 'Cormorant Garamond', serif;">Ericka & Omar</h1>
        </div>
        <div id="usuarioTag" class="text-xs bg-white/70 text-slate-700 px-3 py-1.5 rounded-full border border-white/80 hidden font-medium shadow-sm">
          <span id="nombreMostrado"></span>
        </div>
      </header>

      <div class="scroll-content">
        <!-- Input de cámara oculto -->
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">

        <!-- ====================================================
             PANTALLA DE BIENVENIDA (Registro de Nombre)
             ==================================================== -->
        <section id="stepNombre" class="max-w-md mx-auto p-6 mt-16 relative z-20">
          <div class="glass-card rounded-2xl p-8 text-center">
            <div class="text-5xl mb-4">📸</div>
            <h2 class="text-2xl font-bold mb-2 text-slate-800" style="font-family: 'Cormorant Garamond', serif;">Álbum en Vivo</h2>
            <p class="text-sm text-slate-600 mb-8 font-medium">Ayúdanos a capturar los mejores momentos. Sube tus fotos libres o completa los retos para armar nuestro recuerdo de hoy.</p>
            
            <div class="space-y-4">
              <input type="text" id="nombreInput" placeholder="¿Cuál es tu nombre?" 
                class="w-full px-4 py-3 bg-white/80 border border-white rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#c5a059] text-center text-lg shadow-inner placeholder-slate-400 font-medium">
              <button id="btnEmpezar" class="w-full py-3 bg-boda-primary bg-boda-primary-hover font-bold text-white rounded-xl transition shadow-md uppercase tracking-wider text-sm">
                Entrar al Álbum
              </button>
            </div>
          </div>
        </section>

        <!-- ====================================================
             PANTALLA PRINCIPAL (Responsive: 2 columnas en PC)
             ==================================================== -->
        <main id="mainApp" class="max-w-7xl w-full mx-auto p-4 md:p-8 hidden relative z-20 mt-4">
          
          <div class="flex flex-col md:flex-row gap-8">
            
            <!-- Columna Izquierda: Retos y Captura (1/3 en PC) -->
            <div class="w-full md:w-1/3 lg:w-1/4">
              <section>
                <!-- Botón de Foto Libre -->
                <div class="glass-card border-boda bg-boda-tertiary p-4 rounded-xl flex items-center justify-between gap-3 mb-6 relative overflow-hidden">
                  <div class="absolute -right-4 -bottom-4 opacity-10 text-6xl">📸</div>
                  <div class="flex items-center gap-3 relative z-10">
                    <span class="text-3xl">✨</span>
                    <div>
                      <p class="font-bold text-slate-800 text-sm">Foto Libre</p>
                      <p class="text-xs text-slate-600 mt-0.5 font-medium">Sube cualquier momento.</p>
                    </div>
                  </div>
                  <button onclick="abrirCamara(null)" class="px-4 py-2 bg-boda-secondary text-white hover:bg-opacity-90 active:scale-95 text-xs font-bold rounded-lg transition whitespace-nowrap shadow-sm relative z-10 uppercase tracking-wide">
                    Capturar
                  </button>
                </div>

                <div class="flex items-center justify-between mb-4 mt-6">
                  <h2 class="text-xs font-bold uppercase tracking-widest text-boda-primary">Retos Fotográficos</h2>
                  <div class="h-px bg-boda-primary/30 flex-1 ml-4"></div>
                </div>

                <div id="listaRetos" class="grid gap-3">
                  <!-- Retos inyectados por JS -->
                </div>
              </section>
            </div>

            <!-- Columna Derecha: Muro de Fotos (2/3 en PC) -->
            <div class="w-full md:w-2/3 lg:w-3/4">
              <section>
                <div class="flex items-center justify-between mb-4 mt-8 md:mt-0">
                  <h2 class="text-xs font-bold uppercase tracking-widest text-boda-primary">El Muro de Hoy</h2>
                  <div class="h-px bg-boda-primary/30 flex-1 ml-4"></div>
                </div>
                
                <!-- Rejilla Responsive: 2 en móvil, 4 o 5 en PC -->
                <div id="feedFotos" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 md:gap-4">
                  <!-- Fotos inyectadas por JS -->
                </div>
              </section>
            </div>
            
          </div>
        </main>
      </div> <!-- /scroll-content -->
    </div> <!-- /glass-overlay -->

    <!-- Notificación flotante inferior -->
    <div id="toastSync" class="fixed bottom-6 left-4 right-4 max-w-md mx-auto bg-slate-900/95 backdrop-blur rounded-xl p-3 shadow-2xl flex items-center justify-between gap-3 text-xs hidden z-50 border border-[#c5a059]/30">
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-[#c5a059] animate-ping"></div>
        <span id="toastMsg" class="text-white font-medium tracking-wide">Subiendo foto...</span>
      </div>
      <div class="w-16 bg-slate-800 rounded-full h-1.5 overflow-hidden">
        <div id="toastBar" class="bg-[#c5a059] h-full w-1/3 transition-all duration-300"></div>
      </div>
    </div>
  </div>

  <script>
    // Conexión Directa a tu Base de Datos Supabase
    const SUPABASE_URL = "https://gmdnbjkmayrjmvoxuwzb.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZG5iamttYXlyam12b3h1d3piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NjM1NjAsImV4cCI6MjEwNzEzOTU2MH0.peIkxVX2r7lCGrpeSB8IrVjIi7BUWxsjcf_T9fbWPME";
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let invitado = localStorage.getItem("invitado_nombre") || "";
    let retoSeleccionado = null;

    if (invitado) activarApp();

    document.getElementById("btnEmpezar").addEventListener("click", () => {
      const nombre = document.getElementById("nombreInput").value.trim();
      if (!nombre) return alert("Por favor ingresa tu nombre");
      invitado = nombre;
      localStorage.setItem("invitado_nombre", invitado);
      activarApp();
    });

    function activarApp() {
      document.getElementById("stepNombre").classList.add("hidden");
      document.getElementById("mainApp").classList.remove("hidden");
      document.getElementById("usuarioTag").classList.remove("hidden");
      document.getElementById("nombreMostrado").textContent = invitado;
      cargarRetos();
      cargarFeed();
      escucharFotosEnVivo();
    }

    async function cargarRetos() {
      const { data } = await db.from("retos").select("*");
      document.getElementById("listaRetos").innerHTML = data.map(r => `
        <div class="glass-card p-4 rounded-xl flex items-center justify-between gap-3 relative overflow-hidden group hover:bg-white/80 transition duration-300">
          <div class="flex items-center gap-3 relative z-10">
            <span class="text-3xl filter drop-shadow-sm">${r.icono}</span>
            <div>
              <p class="font-bold text-slate-800 text-sm leading-tight">${r.titulo}</p>
              <p class="text-xs text-slate-600 mt-0.5 font-medium leading-snug">${r.descripcion}</p>
            </div>
          </div>
          <button onclick="abrirCamara('${r.id}')" class="px-3.5 py-1.5 bg-white text-boda-primary border border-boda hover:bg-boda-primary hover:text-white active:scale-95 text-xs font-bold rounded-lg transition whitespace-nowrap shadow-sm relative z-10 uppercase tracking-wide">
            Cumplir
          </button>
        </div>
      `).join("");
    }

    async function cargarFeed() {
      const { data } = await db.from("fotos").select("*, retos(titulo, icono)").order("created_at", { ascending: false });
      document.getElementById("feedFotos").innerHTML = data.map(f => renderCard(f)).join("");
    }

    function renderCard(f) {
      const iconoReto = f.retos ? f.retos.icono : '✨';
      const tituloReto = f.retos ? f.retos.titulo : 'Foto Libre';
      
      return `
        <div class="glass-card rounded-xl overflow-hidden flex flex-col group relative">
          <div class="w-full aspect-square overflow-hidden bg-slate-200">
            <img src="${f.url_feed}" class="w-full h-full object-cover transition duration-500 group-hover:scale-105" loading="lazy">
          </div>
          <div class="p-2.5 flex-1 flex flex-col justify-between bg-white/60">
            <span class="text-[10px] text-boda-primary font-bold block truncate uppercase tracking-wide">
              ${iconoReto} ${tituloReto}
            </span>
            <span class="text-xs text-slate-600 font-medium truncate mt-1">📸 ${f.autor}</span>
          </div>
        </div>
      `;
    }

    function escucharFotosEnVivo() {
      db.channel("cambios-feed")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "fotos" }, async (payload) => {
          const { data } = await db.from("fotos").select("*, retos(titulo, icono)").eq("id", payload.new.id).single();
          if (data) document.getElementById("feedFotos").insertAdjacentHTML("afterbegin", renderCard(data));
        }).subscribe();
    }

    window.abrirCamara = function(id) { 
      retoSeleccionado = id; 
      document.getElementById("cameraInput").click(); 
    };

    document.getElementById("cameraInput").addEventListener("change", async (e) => {
      const originalFile = e.target.files[0];
      if (!originalFile) return;

      const baseName = Date.now();
      const feedBlob = await comprimirImagen(originalFile, 1000, 0.7);
      
      const { error: err1 } = await db.storage.from("fotos-feed").upload(`feed_${baseName}.jpg`, feedBlob, { contentType: "image/jpeg" });
      if (err1) return alert("Error al subir. Revisa tu conexión a internet.");

      const urlFeed = db.storage.from("fotos-feed").getPublicUrl(`feed_${baseName}.jpg`).data.publicUrl;
      const { data: foto } = await db.from("fotos").insert({ 
        reto_id: retoSeleccionado, 
        autor: invitado, 
        url_feed: urlFeed 
      }).select().single();

      mostrarToast("Foto en el álbum. Guardando original en alta resolución...", 40);
      
      const { error: err2 } = await db.storage.from("fotos-originales").upload(`orig_${baseName}.jpg`, originalFile, { contentType: originalFile.type });
      if (!err2) {
        const urlOrig = db.storage.from("fotos-originales").getPublicUrl(`orig_${baseName}.jpg`).data.publicUrl;
        await db.from("fotos").update({ url_original: urlOrig, estado_original: "completado" }).eq("id", foto.id);
        document.getElementById("toastBar").style.width = "100%";
        mostrarToast("¡Alta resolución guardada con éxito!", 100);
        setTimeout(() => document.getElementById("toastSync").classList.add("hidden"), 3000);
      }
    });

    function mostrarToast(msg, w) {
      document.getElementById("toastSync").classList.remove("hidden");
      document.getElementById("toastMsg").textContent = msg;
      document.getElementById("toastBar").style.width = w + "%";
    }

    function comprimirImagen(file, max, q) {
      return new Promise(res => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            let [w, h] = [img.width, img.height];
            if (w > h && w > max) { h *= max / w; w = max; } 
            else if (h > max) { w *= max / h; h = max; }
            const cvs = document.createElement("canvas");
            cvs.width = w; cvs.height = h;
            cvs.getContext("2d").drawImage(img, 0, 0, w, h);
            cvs.toBlob(blob => res(blob), "image/jpeg", q);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
